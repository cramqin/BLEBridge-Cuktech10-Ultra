name: Release APK

# Manually triggered from the GitHub "Actions" tab -> "Release APK" -> "Run workflow".
# Builds a signed release APK and publishes it as a GitHub Release tagged v<version>.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name, e.g. 1.0.1 (tag v1.0.1 will be created)"
        required: true
      notes:
        description: "Release notes (optional)"
        required: false
        default: ""
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret missing. Run the 'Setup Release Keystore' workflow first."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          touch .env

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PappVersionName="${{ inputs.version }}" \
            -PappVersionCode="${{ github.run_number }}"

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             "BLEBridge-Cuktech10-Ultra-v${{ inputs.version }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          body: ${{ inputs.notes }}
          prerelease: ${{ inputs.prerelease }}
          target_commitish: ${{ github.sha }}
          files: BLEBridge-Cuktech10-Ultra-v${{ inputs.version }}.apk
          fail_on_unmatched_files: true
