name: Setup Release Keystore (one-time)

# Run this ONCE. It generates a permanent release signing key and stores it as
# repository secrets (KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD).
# Requires a temporary secret SECRETS_PAT (token allowed to write repo secrets);
# delete SECRETS_PAT afterwards.

on:
  workflow_dispatch:
    inputs:
      overwrite:
        description: "Overwrite an existing keystore (breaks updates of installed apps!)"
        type: boolean
        default: false

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to overwrite existing key
        env:
          EXISTING: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$EXISTING" ] && [ "${{ inputs.overwrite }}" != "true" ]; then
            echo "::error::KEYSTORE_BASE64 already exists. Re-run with overwrite=true only if you really mean it."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate keystore and store as secrets
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          set -euo pipefail
          PASS=$(openssl rand -base64 24 | tr -d '/+=')
          echo "::add-mask::$PASS"
          keytool -genkeypair -v -keystore release.jks -storetype PKCS12 \
            -alias upload -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=BLEBridge Cuktech10 Ultra, O=${{ github.repository_owner }}"
          base64 -w0 release.jks | gh secret set KEYSTORE_BASE64 -R "${{ github.repository }}"
          printf '%s' "$PASS" | gh secret set STORE_PASSWORD -R "${{ github.repository }}"
          printf '%s' "$PASS" | gh secret set KEY_PASSWORD -R "${{ github.repository }}"
          rm -f release.jks
          echo "Keystore secrets created."
